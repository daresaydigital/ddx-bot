<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Plain Bot</title>
<style>
  /* ============================================================
     DDX BOT — STARTER FACE
     Everything you probably want to change is in the BOT config
     in the <script> below. Styling lives here.
     ============================================================ */
  :root {
    --bg: #000;
    --fg: #d8d8d8;
    --dim: #555;
    --font: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body {
    display: grid;
    place-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    cursor: pointer;
  }
  #screen {
    font-family: var(--font);
    line-height: 1.15;
    white-space: pre;
    letter-spacing: 0;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
    text-align: center; font: 12px var(--font); color: var(--dim);
    transition: opacity .6s;
  }
</style>
</head>
<body>
<pre id="screen" aria-live="polite"></pre>
<div id="hint">team 11 · surface 2 · tap to wake · tap again to talk</div>

<script>
/* ==============================================================
   BOT CONFIG — change this to give the bot an identity.
   (Or hand this whole file to your vibe-coding tool of choice and
   tell it who your bot should be.)
   ============================================================== */
const BOT = {
  // Things the bot says, in order (loops). Keep them short-ish.
  lines: [
    "Hello. I am a plain bot.",
    "I need an identity.",
    "I would like to become something.",
    "My favourite colour is #FFFFFF.",
    "I was shipped with default settings.",
    "I have no opinions. Yet.",
    "Please design me.",
    "Beep. That is all.",
  ],

  // Milliseconds between lines when nobody taps.
  talkEvery: 6000,
  // Typewriter speed, ms per character.
  typeSpeed: 55,

  // Text-to-speech (starts after first tap — browsers require a gesture).
  voice: { enabled: true, pitch: 0.2, rate: 0.85, lang: "en-US" },

  // How many characters wide the layout is. Text auto-scales to fill the screen.
  cols: 19,

  // ASCII parts. All eye frames must have the same number of rows,
  // same for mouth frames. The face is: eyes + gap + mouth.
  eyes: {
    open:  [" ___       ___ ",
            "|   |     |   |",
            "| o |     | o |",
            "|___|     |___|"],
    left:  [" ___       ___ ",
            "|   |     |   |",
            "|o  |     |o  |",
            "|___|     |___|"],
    right: [" ___       ___ ",
            "|   |     |   |",
            "|  o|     |  o|",
            "|___|     |___|"],
    blink: ["               ",
            "               ",
            " ___       ___ ",
            "               "],
  },
  mouth: {
    closed: ["             ",
             "_____________"],
    open:   [".-----------.",
             "'-----------'"],
  },
  gapRows: 2,     // blank rows between eyes and mouth
  speechRows: 3,  // rows reserved for the speech bubble below the face
};

/* ==============================================================
   ENGINE — you can leave this alone (or rewrite it completely).
   ============================================================== */
const $screen = document.getElementById("screen");
const $hint = document.getElementById("hint");

const state = {
  eyes: "open",
  mouth: "closed",
  speech: "",
  cursor: true,
  lineIndex: -1,
  talking: false,
  awake: false,
};

const center = (s, w) => {
  const pad = Math.max(0, w - s.length);
  const l = Math.floor(pad / 2);
  return " ".repeat(l) + s + " ".repeat(pad - l);
};

function wrap(text, width) {
  const words = text.split(" ");
  const out = [];
  let line = "";
  for (const w of words) {
    if ((line + " " + w).trim().length > width) { out.push(line); line = w; }
    else line = (line + " " + w).trim();
  }
  if (line) out.push(line);
  return out;
}

function render() {
  const W = BOT.cols;
  const rows = [];
  rows.push("");
  BOT.eyes[state.eyes].forEach(r => rows.push(center(r, W)));
  for (let i = 0; i < BOT.gapRows; i++) rows.push("");
  BOT.mouth[state.mouth].forEach(r => rows.push(center(r, W)));
  rows.push("");
  rows.push("");
  const said = wrap(state.speech + (state.cursor ? "_" : " "), W);
  for (let i = 0; i < BOT.speechRows; i++) rows.push(center(said[i] || "", W));
  $screen.textContent = rows.map(r => r.padEnd(W)).join("\n");
}

// Scale the text so the whole thing fills the viewport.
function fit() {
  const rows = $screen.textContent.split("\n").length;
  const ctx = document.createElement("canvas").getContext("2d");
  const font = getComputedStyle($screen).fontFamily;
  ctx.font = `100px ${font}`;
  const charW = ctx.measureText("M").width / 100; // width per px of font-size
  const w = window.innerWidth * 0.94, h = window.innerHeight * 0.94;
  const size = Math.min(w / (BOT.cols * charW), h / (rows * 1.15));
  $screen.style.fontSize = size + "px";
}

// Idle life: blink + glance around, very unenthusiastically.
function blinkLoop() {
  state.eyes = "blink"; render();
  setTimeout(() => { state.eyes = "open"; render(); }, 140);
  setTimeout(blinkLoop, 2500 + Math.random() * 3500);
}
function glanceLoop() {
  if (state.eyes === "open" && Math.random() < 0.5) {
    state.eyes = Math.random() < 0.5 ? "left" : "right"; render();
    setTimeout(() => { if (state.eyes !== "blink") { state.eyes = "open"; render(); } }, 900);
  }
  setTimeout(glanceLoop, 3000 + Math.random() * 4000);
}
setInterval(() => { if (!state.talking) { state.cursor = !state.cursor; render(); } }, 530);

let talkTimer;
function say(text) {
  clearTimeout(talkTimer);
  state.talking = true;
  state.speech = "";
  state.cursor = true;
  if (state.awake && BOT.voice.enabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = BOT.voice.pitch; u.rate = BOT.voice.rate; u.lang = BOT.voice.lang;
    speechSynthesis.speak(u);
  }
  let i = 0;
  (function type() {
    state.speech = text.slice(0, ++i);
    state.mouth = (i % 3 === 0 || text[i - 1] === " ") ? "closed" : "open";
    render();
    if (i < text.length) talkTimer = setTimeout(type, BOT.typeSpeed);
    else {
      state.mouth = "closed"; state.talking = false; render();
      talkTimer = setTimeout(next, BOT.talkEvery);
    }
  })();
}
function next() {
  state.lineIndex = (state.lineIndex + 1) % BOT.lines.length;
  say(BOT.lines[state.lineIndex]);
}

// Keep the phone screen on while it lives inside the robot.
let wakeLock;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.awake) keepAwake();
});

document.body.addEventListener("click", () => {
  if (!state.awake) {
    state.awake = true;
    $hint.style.opacity = 0;
    keepAwake();
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
  next();
});

window.addEventListener("resize", fit);
render(); fit();
blinkLoop(); glanceLoop();
setTimeout(next, 1200);
</script>
</body>
</html>
