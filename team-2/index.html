<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gandalf the Orange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #d9dcdf;
    --ink: #2b3038;
    --dim: #8b939c;
    --accent: #c4560a;
    --chip: #cbd0d4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e2227; --ink: #d8dce0; --dim: #5a626b; --accent: #ff9a4d; --chip: #2a3037;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e2227; --ink: #d8dce0; --dim: #5a626b; --accent: #ff9a4d; --chip: #2a3037;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem 2.5rem;
  }
  main { width: 100%; max-width: 40rem; display: flex; flex-direction: column; align-items: center; }
  .mouth-wrap { overflow-x: auto; max-width: 100%; }
  pre#mouth {
    margin: 0;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: min(18px, calc((100vw - 2.5rem) / 24.5));
    line-height: 1.15;
    height: calc(8 * 1.15em);
    color: var(--ink);
    white-space: pre;
    transition: text-shadow .15s;
  }
  pre#mouth i { font-style: normal; color: var(--dim); }
  pre#mouth.speaking { text-shadow: 0 0 .6em color-mix(in srgb, var(--accent) 55%, transparent); }
  pre#mouth.speaking b { color: var(--accent); font-weight: 700; }
  pre#mouth b { font-weight: 400; }

  .speech {
    margin: 2rem 0 1.75rem;
    min-height: 7.5rem;
    width: 100%;
    max-width: 34rem;
    font-size: 1.35rem;
    line-height: 1.45;
    font-style: italic;
    text-align: left;
  }
  .speech .caret { display: inline-block; width: .5ch; border-bottom: 2px solid var(--accent); margin-left: 2px; }

  nav { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
  button {
    font: inherit;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: .8rem;
    color: var(--ink);
    background: var(--chip);
    border: 1px solid var(--dim);
    border-radius: 999px;
    padding: .55rem .95rem;
    cursor: pointer;
    min-height: 2.5rem;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button#voice { border-color: var(--accent); }
  button#voice[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .hint { margin: 1.25rem 0 0; font-size: .95rem; color: var(--dim); text-align: center; max-width: 30rem; }
</style>
</head>
<body>
<main>
  <div class="mouth-wrap"><pre id="mouth" aria-hidden="true"></pre></div>
  <p class="speech" id="speech" aria-live="polite"></p>
  <nav id="nav" aria-label="Topics"></nav>
  <p class="hint" id="hint" hidden></p>
</main>

<script>
(function () {
  var W = 35;
  var mouthEl = document.getElementById('mouth');
  var speechEl = document.getElementById('speech');
  var navEl = document.getElementById('nav');
  var hintEl = document.getElementById('hint');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

  function teeth() {
    var s = ' ';
    for (var i = 0; i < 11; i++) s += '[_]';
    return s + ' ';
  }
  function gap(r) {
    var base = r % 2 === 0 ? ': ' : ' :';
    return base.repeat(18).slice(0, W);
  }
  function frame(o) {
    var rows = [];
    rows.push("  ." + "-".repeat(W) + ".");
    rows.push("o |<b>" + teeth() + "</b>| o");
    for (var r = 0; r < o; r++) rows.push("  |<i>" + gap(r) + "</i>|");
    rows.push("o |<b>" + teeth() + "</b>| o");
    rows.push("  '" + "-".repeat(W) + "'");
    mouthEl.innerHTML = rows.join("\n");
  }

  function openness(ch) {
    var c = ch.toLowerCase();
    if ("aeoåäö".indexOf(c) > -1) return 4;
    if ("iuy".indexOf(c) > -1) return 2;
    if (/[a-z]/.test(c)) return 1;
    return 0;
  }

  var lines = [
    { label: "Who are you?", text: "I am Gandalf the Orange, a wizard of the orange kind. I am never late, nor early. I arrive precisely when the problem has been properly defined." },
    { label: "Curiosity", text: "Ask the strange question first. The obvious answer will wait for you; it always does." },
    { label: "Energy", text: "Bring a spark into the fellowship. A room with energy solves problems that a quiet room merely files." },
    { label: "Challenge", text: "\u201CWe have always done it this way\u201D is not a reason. It is a symptom. Let us poke it." },
    { label: "See and do", text: "Sketch it. Show it. Break it. Sketch it again. We learn by seeing what we did, then doing it better." },
    { label: "The problem", text: "Before the solution: what is the problem, for whom, and what does a good day look like for the end customer?" },
    { label: "Confession", text: "In quiet hours I draw seahorses with long, pastel manes. Do not tell the client." }
  ];

  /* ---- voice: deep, slow, British male; inspired by, not a clone of, any actor ---- */
  var voiceOn = false;
  var chosenVoice = null;

  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices();
    if (!vs.length) return;
    var prefer = ["Daniel", "Arthur", "Google UK English Male", "Oliver", "Rishi", "Ryan", "Thomas", "George", "Malcolm"];
    var gb = vs.filter(function (v) { return /en[-_]GB/i.test(v.lang); });
    var found = null;
    for (var i = 0; i < prefer.length && !found; i++) {
      found = gb.filter(function (v) { return v.name.indexOf(prefer[i]) > -1; })[0] || null;
    }
    chosenVoice = found || gb[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
  }
  if (synth) {
    pickVoice();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);
  }

  var timer = null;
  var guard = null;
  var current = -1;

  function stop() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (guard) { clearTimeout(guard); guard = null; }
    if (synth) synth.cancel();
  }

  function setActive(i) {
    current = i;
    Array.prototype.forEach.call(navEl.querySelectorAll('button.topic'), function (b, idx) {
      b.setAttribute('aria-pressed', idx === i ? 'true' : 'false');
    });
  }

  function speak(i) {
    stop();
    setActive(i);
    var text = lines[i].text;
    var useVoice = voiceOn && synth;
    var n = 0;
    var finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      if (timer) { clearTimeout(timer); timer = null; }
      if (guard) { clearTimeout(guard); guard = null; }
      frame(0);
      mouthEl.classList.remove('speaking');
      speechEl.textContent = text;
    }

    if (useVoice) {
      var u = new SpeechSynthesisUtterance(text);
      if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; } else { u.lang = 'en-GB'; }
      u.pitch = 0.6;
      u.rate = 0.82;
      u.onboundary = function (e) {
        if (typeof e.charIndex === 'number' && e.charIndex > n) n = e.charIndex;
      };
      u.onend = finish;
      u.onerror = finish;
      synth.speak(u);
      guard = setTimeout(finish, text.length * 160 + 4000);
    }

    if (reduce) {
      speechEl.textContent = text;
      frame(0);
      return;
    }

    mouthEl.classList.add('speaking');
    var pace = useVoice ? 78 : 48;
    (function step() {
      if (finished) return;
      if (n >= text.length) {
        if (useVoice) {
          frame(1 + Math.floor(Math.random() * 3));
          timer = setTimeout(step, 90);
        } else {
          timer = setTimeout(finish, 160);
        }
        return;
      }
      n++;
      speechEl.innerHTML = '';
      speechEl.appendChild(document.createTextNode(text.slice(0, n)));
      var caret = document.createElement('span');
      caret.className = 'caret';
      speechEl.appendChild(caret);
      frame(openness(text.charAt(n - 1)));
      timer = setTimeout(step, pace);
    })();
  }

  lines.forEach(function (l, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'topic';
    b.textContent = l.label;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { speak(i); });
    navEl.appendChild(b);
  });

  if (synth) {
    var vb = document.createElement('button');
    vb.type = 'button';
    vb.id = 'voice';
    vb.textContent = 'Voice off';
    vb.setAttribute('aria-pressed', 'false');
    vb.addEventListener('click', function () {
      voiceOn = !voiceOn;
      vb.setAttribute('aria-pressed', voiceOn ? 'true' : 'false');
      vb.textContent = voiceOn ? 'Voice on' : 'Voice off';
      if (voiceOn) {
        hintEl.hidden = false;
        hintEl.textContent = chosenVoice
          ? 'Voice: ' + chosenVoice.name + ', pitched low and slowed. Quality depends on your device.'
          : 'No British voice found on this device; using the default, pitched low and slowed.';
        speak(current < 0 ? 0 : current);
      } else {
        hintEl.hidden = true;
        stop();
        mouthEl.classList.remove('speaking');
        frame(0);
        if (current > -1) speechEl.textContent = lines[current].text;
      }
    });
    navEl.appendChild(vb);
  }

  frame(0);
  setTimeout(function () { speak(0); }, reduce ? 0 : 500);
})();
</script>
</body>
</html>
